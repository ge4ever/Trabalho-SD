services:
  db:
    image: postgres:15-alpine
    container_name: banco_sd_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-banco_sd}
      POSTGRES_USER: ${DB_USER:-sd_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sd_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
